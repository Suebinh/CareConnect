<head>

<title>CareConnect V2 | Launch video</title>

<style>
:root{
  --accent:#D83995;            /* CareConnect hot pink (site accent) */
  --accent-on:#FF9AD5;         /* accent for text sitting directly on the blue/navy background */

  --ink:#062A3D; --mute:#6d7076; --line:#e6e6e3; --bg:#F3F3F0; --green:#FCFFFF;

  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  --shadow:0 2px 6px rgba(20,22,30,.05),0 30px 80px -20px rgba(20,22,30,.22),0 60px 140px -40px rgba(20,22,30,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0c0d;overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:#041a26;color:var(--snow)}
#gl{position:absolute;inset:0;width:1920px;height:1080px}
#pbg{display:none}
#pbgMask{position:absolute;inset:0;overflow:hidden;opacity:.62;
  -webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.5) 18%,transparent 46%);mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.5) 18%,transparent 46%)}
#blur{position:absolute;left:0;top:0;width:240px;height:135px;transform-origin:0 0;transform:scale(8);filter:blur(4px)}
.scene{position:absolute;inset:0;display:none;transform-origin:960px 540px}
.scene *{position:absolute}
.scene span,.scene b,.scene i,.scene svg.il{position:static}
.red{color:var(--accent-on)}
.card .red,.lp .red,#cxPanel .red{color:var(--accent)}
.w{display:inline-block;position:static!important;white-space:pre}
.tight{letter-spacing:-.035em;font-weight:600}
.center{left:0;width:1920px;text-align:center}
.caret{display:inline-block;width:.5em;height:.95em;background:currentColor;margin-left:.08em;vertical-align:-.08em}
.caret.off{opacity:0}
.card{color:var(--ink);background:rgba(252,255,255,.95);border-radius:20px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9)}
.appicon{background:linear-gradient(160deg,#f277c0,var(--accent) 55%,#ad2274);border-radius:24%;display:flex!important;align-items:center;justify-content:center;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 18px 40px -12px rgba(216,57,149,.6)}
.appicon svg{width:66%;height:auto;position:static}
.v2{display:inline-block;background:var(--accent);color:#fff;font-weight:700;letter-spacing:0;border-radius:999px;padding:.12em .5em;font-size:.34em;vertical-align:.95em;margin-left:.3em}
.lp{color:var(--ink);display:inline-flex;position:static!important;align-items:center;gap:.28em;background:#fff;border-radius:999px;padding:.14em .5em .14em .18em;

.lp .appicon,.lp .dot{position:static;width:1.05em;height:1.05em;flex:none}
.lp .dot{border-radius:50%;background:linear-gradient(150deg,#0593C6,#D83995)}
.chip{color:var(--ink);background:#fff;border-radius:999px;padding:14px 24px 14px 20px;font-size:28px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;

.chip i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(216,57,149,.16);flex:none}
.new{display:inline-block;background:var(--accent);color:#fff;font-size:.4em;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:.3em .7em;vertical-align:.38em;margin-right:.5em}

#cxPanel .ph{left:24px;top:24px;font-size:24px;display:flex;align-items:center;gap:10px}
#cxPanel .ph .appicon{position:static;width:36px;height:36px}
#cxPanel .pt{left:24px;top:92px;font-size:22px;font-weight:600;letter-spacing:-.02em}
#cxPanel .ps{left:24px;top:124px;font-size:16px;color:var(--mute)}
.pday{top:170px;width:62px;height:72px;border-radius:14px;border:1px solid var(--line);font-size:13px;color:var(--mute);text-align:center;padding-top:12px}
.pday b{display:block;font-size:22px;color:var(--ink)}
.pday.on{background:var(--ink);border-color:var(--ink);color:#bbb}.pday.on b{color:#fff}
.pslot{width:168px;height:52px;border-radius:12px;border:1px solid var(--line);font-family:var(--mono);font-size:17px;display:flex;align-items:center;justify-content:center}
.pslot.x{color:#bbb;background:#f5f5f3;text-decoration:line-through}
.pslot.on{background:var(--accent);border-color:var(--accent);color:#fff}
#cxPanel .pr{left:24px;top:540px;width:352px;height:56px;border-radius:14px;background:#f6f6f3;font-size:16px;display:flex;align-items:center;padding:0 16px;justify-content:space-between}
#cxPanel .pr i{width:44px;height:26px;border-radius:99px;background:var(--accent);box-shadow:inset -9px 0 0 -0px transparent;position:relative}
#cxPanel .pr i::after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
#cxPanel .pb{left:24px;top:620px;width:352px;height:60px;border-radius:14px;background:var(--ink);color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center}

/* features */
.ftH{top:120px;font-size:62px}
.ftCard{left:490px;top:350px;width:780px;height:500px}
.ftCall{left:1236px}
.cT{left:36px;top:32px;font-size:30px}
.cS{left:36px;top:74px;font-size:19px;color:var(--mute)}
.day{top:124px;width:128px;height:64px;border-radius:14px;border:1px solid var(--line);font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mute)}

.slot.x{color:#bcbcb8;background:#f5f5f2}
#f1Foot{left:36px;top:436px;font-size:19px;color:var(--mute)}
.mail{left:200px;top:70px;width:380px;height:360px;padding:0}
.mail .mh{left:24px;top:22px;display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600}
.mail .mh .appicon{position:static;width:32px;height:32px}
.mail .tag{right:22px;top:24px;font-size:14px;font-weight:600;border-radius:99px;padding:5px 12px;background:#f1f1ee;color:#555}
.mail .ms{left:24px;top:84px;font-size:26px;line-height:1.15;width:330px}

.blk{top:5px;height:36px;border-radius:8px;background:var(--ink);transform-origin:0 50%}
.hr{top:118px;font-family:var(--mono);font-size:14px;color:var(--mute)}
#f5Tip{font-family:var(--mono);font-size:15px;background:var(--ink);color:#fff;border-radius:8px;padding:6px 10px;white-space:nowrap}

/* payoff / tagline / end */

.tg{font-size:136px;color:var(--green);letter-spacing:-.045em;font-weight:600}

  display:flex;align-items:center;justify-content:center;gap:26px;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 30px 70px -20px rgba(216,57,149,.75)}
#enCta i{width:2px;height:48px;background:rgba(255,255,255,.5)}

/* cursor, flash */
#cursor{position:absolute;left:0;top:0;width:34px;height:50px;transform-origin:4px 3px;visibility:hidden;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.ripple{position:absolute;left:0;top:0;width:0;height:0;border-radius:50%;border:5px solid var(--accent);visibility:hidden}
#flash{position:absolute;inset:0;background:#02090e;pointer-events:none}

/* debug bar (hidden in record mode) */
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;background:#17181a;color:#ddd;display:flex;align-items:center;gap:14px;padding:0 18px;font:13px var(--mono);border-top:1px solid #2a2b2e}
#bar button{background:#2a2b2e;color:#eee;border:0;border-radius:8px;height:34px;padding:0 14px;font:inherit;cursor:pointer}
#bar button:hover{background:#3a3b3f}
#rail{position:relative;flex:1;height:34px}
#seek{position:absolute;inset:0;width:100%;margin:0;accent-color:var(--accent)}
#marks{position:absolute;left:8px;right:8px;top:0;height:6px;pointer-events:none}

#marks i.b{background:var(--accent);height:4px}
#read{min-width:300px;text-align:right;white-space:nowrap}
body.rec #bar{display:none} body.rec{cursor:none;background:#000}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="pbg"><div id="pbgMask"><canvas id="blur" width="240" height="135"></canvas></div></div>
  <div id="scenes"></div>
  <svg id="cursor" viewBox="0 0 34 50"><path d="M3 2 L3 38 L12 30 L18 45 L24 42.5 L18 28 L30 28 Z" fill="#111" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg>
  <div id="flash"></div>
</div>
<div id="bar">
  <button id="bPlay">Pause</button>
  <div id="rail"><div id="marks"></div><input id="seek" type="range" min="0" max="1" step="0.001" value="0"></div>
  <div id="read"></div>
  <button id="bRec" title="Hide the bar and play from 0 (R). Esc exits.">Record</button>
</div>

<script>
/* =====================================================================
   TIMELINE CONFIG: retime everything here (seconds).
   Scene-internal beats are offsets from the scene's own start.
   ===================================================================== */
const TL = {
  fps: 30,
  duration: 36.5,
  crossfade: 0.45,                       // blur + scale + opacity dissolve between scenes
  scenes: [
    { id:'hook',     start: 0.0, end: 4.5,  world:'dream'   },
    { id:'search',   start: 4.5, end: 8.0,  world:'product' },
    { id:'overload', start: 8.0, end:10.0,  world:'product' },
    { id:'whatif',   start:10.0, end:12.0,  world:'product' },
    { id:'logo',     start:12.0, end:15.0,  world:'dream'   },
    { id:'context',  start:15.0, end:19.5,  world:'product' },
    { id:'features', start:19.5, end:29.0,  world:'product' },
    { id:'payoff',   start:29.0, end:32.0,  world:'product' },
    { id:'tagline',  start:32.0, end:34.5,  world:'dream'   },
    { id:'end',      start:34.5, end:36.5,  world:'dream'   },
  ],
  beats: {
    hook:    { lines:.25, arc:[.5,2.1], clear:2.05, type:2.5 },
    search:  { type:.3, pullback:[1.9,2.7] },
    context: { browser:.3, panel:1.65, morph:2.0, zoom:[3.0,3.9] },
    features:{ len:1.9 },                // five beats, each this long
    payoff:  { type:.15, chips:.6 },
  },
  /* Cursor paths: keyframes per scene, t is seconds from that scene's start, x/y in 1920x1080 stage pixels. */
  cursor: {
    search:  [ {t:2.3,x:1700,y:960}, {t:3.0,x:1392,y:640,click:true}, {t:3.4,x:1392,y:640} ],
    context: [ {t:.9,x:1050,y:900}, {t:1.6,x:1500,y:316,click:true}, {t:2.2,x:1500,y:316}, {t:2.9,x:1430,y:640} ],
    features:[ {t:.3,x:1560,y:930}, {t:1.0,x:1151,y:634,click:true}, {t:1.7,x:1151,y:634},     // slot click
               {t:2.7,x:880,y:620}, {t:3.6,x:900,y:640},                                        // hover email

function show(el,o,tf,blur){
  if(o<=.003){ if(el._v!==0){el.style.visibility='hidden';el._v=0;} return false; }
  if(el._v!==1){el.style.visibility='visible';el._v=1;}
  el.style.opacity=o; if(tf!==undefined) el.style.transform=tf; el.style.filter=blur>.3?`blur(${blur.toFixed(1)}px)`:''; return true;
}
/* blur + scale + fade envelope between a and b */
function pop(el,t,a,b,o={}){
  const i=Ez.expo(prog(t,a,a+(o.fi||.55))), x=Ez.in(prog(t,b-(o.fo||.35),b));
  const s=lerp(o.s0??.94,1,i)*lerp(1,o.s1??1.05,x), y=lerp(o.y0??22,0,i)+(o.y||0), bl=o.b??14;
  return show(el,i*(1-x),`translate(${o.x||0}px,${y}px) scale(${s})${o.tf||''}`,(1-i)*bl+x*bl);
}
/* typewriter with block caret; segs: [{t:'text',red:true} | {html:'<span…>'}] */
function typer(el,segs,t,start,cps=26){
  const total=segs.reduce((a,s)=>a+(s.html?1:s.t.length),0), n=Math.floor(clamp((t-start)*cps,0,total));
  const on=(n>0&&n<total)||Math.floor(t*2.6)%2===0, key=n+'|'+on; if(el._k===key) return n/total; el._k=key;
  let out='',left=n; for(const s of segs){ if(left<=0)break; if(s.html){out+=s.html;left--;continue;} const tx=s.t.slice(0,left); left-=tx.length; out+=s.red?`<span class="red">${tx}</span>`:tx; }
  el.innerHTML=out+`<span class="caret${on?'':' off'}"></span>`; return n/total;
}

      <path d="M0 230H708M0 160H708M0 90H708" stroke="#eeeeea" stroke-width="1.5"/>
      <path id="f3Area" d="${chartPath} L708 250 L0 250 Z" fill="rgba(216,57,149,.08)"/>
      <path id="f3Line" d="${chartPath}" fill="none" stroke="#D83995" stroke-width="5" stroke-linecap="round"/>
      <g id="f3Scrub"><path id="f3Rule" d="M0 0V250" stroke="#111" stroke-width="1.5" stroke-dasharray="4 5"/><circle id="f3Dot" r="10" fill="#fff" stroke="#D83995" stroke-width="5"/></g>
    </svg>
  </div>
  <div class="ftCard card" id="fC3">
    <div class="cT tight">No-shows by visit type</div><div class="cS">Last 30 days · de-identified</div>
    <svg style="left:50px;top:130px" width="320" height="320" viewBox="-160 -160 320 320">${DON.map((d,i)=>`<circle class="don" r="112" fill="none" stroke="${d[2]}" stroke-width="36"/>`).join('')}</svg>
    <div class="big" style="left:50px;top:258px;width:320px;text-align:center;font-size:50px">8.4%</div>
    <div style="left:50px;top:320px;width:320px;text-align:center;font-size:17px;color:var(--mute)">no-show rate</div>
    ${DON.map((d,i)=>`<div class="leg" style="top:${132+i*78}px"><i style="background:${d[2]}"></i>${d[0]}<b>${Math.round(d[1]*100)}%</b></div>`).join('')}
  </div>
  <div class="ftCard card" id="fC4">
    <div class="cT tight">Today · all providers</div><div class="cS">Tue, Nov 17</div>
    ${['8a','10a','12p','2p','4p'].map((h,i)=>`<div class="hr" style="left:${190+i*132}px">${h}</div>`).join('')}
    ${ROWS.map((r,i)=>`<div class="rowL" style="top:${164+i*76}px">${r[0]}</div><div class="track" style="top:${152+i*76}px">${r[1].map(b=>`<div class="blk" style="left:${b[0]*554}px;width:${b[1]*554-5}px"></div>`).join('')}</div>`).join('')}
    <div id="f5Tip">10:00–11:00 · Booked</div>
  </div>
  ${FEAT.map((f,i)=>`<div class="ftCall chip" id="fX${i}" style="top:${f.cy}px"><i></i>${f.call}</div>`).join('')}`,
(lt,t)=>{
  const L=B.features.len, cur=cursorAt(t), C=TL.cursor.features;
  FEAT.forEach((f,i)=>{
    const bt=lt-i*L, last=i===FEAT.length-1, end=last?L+1:L;
    if(bt<-.4||bt>end+.4){ show($('#fH'+i),0); show($('#fC'+i),0); show($('#fX'+i),0); return; }
    show($('#fH'+i),prog(bt,-.05,.1)*(1-Ez.in(prog(bt,end-.3,end))),`translateY(${-20*Ez.in(prog(bt,end-.3,end))}px)`,Ez.in(prog(bt,end-.3,end))*12); words($('#fH'+i),bt,.0,.06,.5);
    pop($('#fC'+i),bt,-.12,end+.12,{s0:.86,s1:1.1,b:22,y:Math.sin(t*1.3+i)*6,fi:.6,fo:.4});
    const xi=Ez.spring(prog(bt,.5,1.2)), xo=Ez.in(prog(bt,end-.3,end));
    show($('#fX'+i),prog(bt,.5,.65)*(1-xo),`translate(${(1-xi)*50}px,${Math.sin(t*1.6+i*2)*5}px) scale(${lerp(.7,1,xi)})`,xo*10);
  });
  { // A: slot click
    const on=lt>=C[1].t+.05, s=$('#f1Slot'), k=Ez.spring(prog(lt,C[1].t+.05,C[1].t+.55));
    s.style.background=on?'#D83995':''; s.style.color=on?'#fff':''; s.style.borderColor=on?'#D83995':''; s.textContent=on?'✓ Booked':'10:30 AM';
    s.style.transform=`scale(${on?lerp(.9,1,k):1})`; $('#f1Foot').style.opacity=Ez.out(prog(lt,C[1].t+.2,C[1].t+.6));
  }
  { // B: fanned emails
    const bt=lt-L, hov=Ez.io(prog(lt,C[3].t-.25,C[3].t+.1));
    document.querySelectorAll('#fC1 .mail').forEach((m,i)=>{ const p=Ez.expo(prog(bt,.05+i*.1,.75+i*.1)), side=[-1,1,0][i];
      m.style.zIndex=side===0?3:1; m.style.borderColor=side===0?`rgba(216,57,149,${hov})`:'';
      m.style.transform=`translate3d(${side*250*p}px,${side===0?-18*hov:26*p}px,${side===0?60+40*hov:-90}px) rotateY(${-side*26*p}deg) rotateZ(${side*5*p}deg)`; });
  }
  { // C: line chart + scrub
    const bt=lt-2*L, line=$('#f3Line'), len=line._len||(line._len=line.getTotalLength()), d=Ez.io(prog(bt,.1,.85));
    line.style.strokeDasharray=len; line.style.strokeDashoffset=len*(1-d); $('#f3Area').style.opacity=prog(bt,.5,1);
    const sc=prog(lt,C[5].t-.05,C[5].t+.1)*(cur?1:0), x=clamp((cur?cur.x:1234)-526,0,708);
    let lo=0,hi=len; for(let k=0;k<14;k++){const mid=(lo+hi)/2; line.getPointAtLength(mid).x<x?lo=mid:hi=mid;} const pt=line.getPointAtLength(lo);
    $('#f3Scrub').style.opacity=sc; $('#f3Rule').setAttribute('transform',`translate(${pt.x},0)`); $('#f3Dot').setAttribute('cx',pt.x); $('#f3Dot').setAttribute('cy',pt.y);
    const v=sc>0?Math.round(110+(230-pt.y)/210*110):Math.round(lerp(128,212,d)); $('#f3Num').textContent=v;
    $('#f3Delta').textContent=`▲ ${Math.max(0,Math.round((v/179-1)*100))}% vs last week`;
  }
  { // D: donut + legend hover
    const bt=lt-3*L, sw=Ez.expoIO(prog(bt,.05,.9)), hov=Ez.io(prog(lt,C[7].t-.2,C[7].t+.1)), CIRC=2*Math.PI*112; let acc=0;
    document.querySelectorAll('.don').forEach((c,i)=>{ const f=DON[i][1]; c.style.strokeDasharray=`${Math.max(0,f*CIRC*sw-5)} ${CIRC}`;
      c.style.transform=`rotate(${-90+acc*360*sw}deg)`; acc+=f; if(i===1){c.style.stroke=hov>.5?'#D83995':DON[1][2]; c.style.strokeWidth=36+10*hov;} });
    document.querySelectorAll('.leg').forEach((r,i)=>{ r.style.opacity=Ez.out(prog(bt,.2+i*.08,.6+i*.08));
      if(i===1){ r.style.background=`rgba(216,57,149,${.1*hov})`; r.style.boxShadow=`inset 0 0 0 2px rgba(216,57,149,${hov})`; r.style.color=hov>.5?'#D83995':''; r.firstChild.style.background=hov>.5?'#D83995':DON[1][2]; } });
  }
  { // E: combined schedule
    const bt=lt-4*L, hov=prog(lt,C[9].t-.15,C[9].t+.05); let n=0;
    document.querySelectorAll('#fC4 .track').forEach((tr,ri)=>tr.querySelectorAll('.blk').forEach((bk,bi)=>{ const p=Ez.expo(prog(bt,.1+n*.022,.6+n*.022)); n++;
      bk.style.transform=`scaleX(${p})`; bk.style.opacity=.25+.75*p; bk.style.background=(ri===1&&bi===1&&hov>.5)?'#D83995':(ri%2?'#3a3d43':'#111214'); }));
    const tip=$('#f5Tip'); tip.style.left='300px'; tip.style.top='196px'; tip.style.opacity=hov; tip.style.transform=`translateY(${(1-hov)*8}px)`;
  }
},()=>FEAT.forEach((f,i)=>mkWords($('#fH'+i),[{html:'<span class="new">NEW</span>'},...f.head])));

/* ===== 8. PAYOFF ===== */
scene('payoff',`
  <div id="pyType" class="center tight"></div>
  <svg id="pyLines" width="1920" height="1080">${COPY.orbit.map(()=>`<path class="pyL" fill="none" stroke="#FCFFFF" stroke-opacity=".5" stroke-width="2"/>`).join('')}</svg>
  ${COPY.orbit.map(o=>`<div class="chip pyC"><i></i>${o}</div>`).join('')}
  <div id="pyLogo" class="card tight">${ICON}${COPY.product}${V2.replace('v2"','v2" style="font-size:18px;vertical-align:0;margin-left:0"')}</div>`,
(lt,t)=>{
  const b=B.payoff;
  typer($('#pyType'),[{t:'The whole clinic. '},{t:'On one schedule.',red:true}],lt,b.type,24);
  pop($('#pyLogo'),lt,.2,9,{s0:.7,y:Math.sin(t*1.4)*4,fi:.7});
  const lines=document.querySelectorAll('.pyL');
  document.querySelectorAll('.pyC').forEach((c,i)=>{ const p=Ez.spring(prog(lt,b.chips+i*.12,b.chips+i*.12+.8)), a=(-90+i*60+18+lt*7)*Math.PI/180;
    const x=960+Math.cos(a)*620*lerp(.4,1,p), y=650+Math.sin(a)*285*lerp(.4,1,p)+Math.sin(t*1.5+i)*5;
    c.style.opacity=prog(lt,b.chips+i*.12,b.chips+i*.12+.2); c.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${lerp(.5,1,p)})`;
    const mx=(960+x)/2-(y-620)*.22, my=(620+y)/2+(x-960)*.22; lines[i].setAttribute('d',`M960 620 Q${mx} ${my} ${x} ${y}`); lines[i].style.opacity=p; });
});

/* ===== 9. TAGLINE ===== */
scene('tagline',`<div id="tg1" class="tg center" style="top:340px"></div><div id="tg2" class="tg center" style="top:500px"></div>`,
(lt)=>{ const o=Ez.in(prog(lt,1.9,2.4)); words($('#tg1'),lt,.15,.1,.7); words($('#tg2'),lt,.7,.1,.7);
  show($('#tg1'),1-o,`translateY(${-30*o}px)`,o*24); show($('#tg2'),1-o,`translateY(${-18*o}px)`,o*24);
},()=>{ mkWords($('#tg1'),[{t:'Fewer no-shows.'}]); mkWords($('#tg2'),[{t:'More care.'}]); });

/* ===== 10. END CARD ===== */
scene('end',`<div id="enRow" class="center tight">${ICON}<span>${COPY.product}${V2.replace('v2"','v2" style="font-size:38px;vertical-align:1.4em"')}</span></div>
  <div id="enCta"><span>${COPY.cta[0]}</span><i></i><span>${COPY.cta[1]}</span></div><div id="enUrl" class="center">${COPY.url}</div>`,
(lt,t)=>{ pop($('#enRow'),lt,.05,9,{fi:.7}); const c=Ez.spring(prog(lt,.3,1.1));
  show($('#enCta'),prog(lt,.3,.5),`translateY(${(1-c)*40+Math.sin(t*1.5)*3}px) scale(${lerp(.8,1,c)})`,0); pop($('#enUrl'),lt,.55,9,{y0:14});
});

/* ---------- cursor ---------- */
const CUR=Object.entries(TL.cursor).map(([id,k])=>{const s=TL.scenes.find(x=>x.id===id).start; return k.map(p=>({...p,t:p.t+s}));});
const cursorEl=$('#cursor'), RIP=[];
CUR.flat().filter(k=>k.click).forEach(k=>{const r=document.createElement('div'); r.className='ripple'; $('#stage').insertBefore(r,cursorEl); RIP.push({k,el:r});});
function cursorAt(t){ for(const g of CUR){ const a=g[0].t,b=g[g.length-1].t; if(t<a-.2||t>b+.3) continue;
  const o=prog(t,a-.2,a)*(1-prog(t,b+.05,b+.3)); let k=0; while(k<g.length-2&&t>g[k+1].t)k++; const A=g[k],Bk=g[k+1];
  const p=Ez.io(prog(t,A.t,Bk.t)), dx=Bk.x-A.x, dy=Bk.y-A.y, arc=Math.sin(Math.PI*p)*.12; return {x:A.x+dx*p-dy*arc,y:A.y+dy*p+dx*arc,o}; } return null; }
function drawCursor(t){ const c=cursorAt(t); let press=0;
  RIP.forEach(({k,el})=>{ const age=t-k.t; if(age<0||age>.65){ if(el._v!==0){el.style.visibility='hidden';el._v=0;} return; } el._v=1; el.style.visibility='visible';
    const r=16+78*Ez.expo(age/.65); el.style.opacity=1-age/.65; el.style.transform=`translate(${k.x-r}px,${k.y-r}px)`; el.style.width=el.style.height=2*r+'px'; el.style.borderWidth=lerp(7,1.5,age/.65)+'px';
    press=Math.max(press,1-age/.18); });
  if(!c||c.o<=0){ if(cursorEl._v!==0){cursorEl.style.visibility='hidden';cursorEl._v=0;} return; }
  cursorEl._v=1; cursorEl.style.visibility='visible'; cursorEl.style.opacity=c.o; cursorEl.style.transform=`translate(${c.x-4}px,${c.y-3}px) scale(${1-.16*Math.max(0,press)})`; }

/* ---------- background: blurred glows + fluted glass, in the site's colours ---------- */
const GL_SCALE=1;                // internal resolution of the background (lower = faster)
const glc=$('#gl'); glc.width=1920*GL_SCALE; glc.height=1080*GL_SCALE;
const gl=glc.getContext('webgl',{antialias:false,alpha:false}); let U=null;
/* Site-style background: drifting blurred glows behind fluted-glass ribs.
   uMix 0 = "dark world" (near-black navy, glows in the corners), 1 = "site world" (sky blue with the pink figure, like the home page). */
const FRAG=`precision highp float;
uniform vec2 uRes; uniform float uT,uSweep,uMix;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float blob(vec2 p,vec2 c,vec2 r){vec2 d=(p-c)/r;return exp(-dot(d,d));}
void main(){
  vec2 f=gl_FragCoord.xy,uv=f/uRes;float asp=uRes.x/uRes.y,t=uT;
  float rp=uRes.x/150.,rx=fract(f.x/rp);
  vec2 p=vec2((uv.x+(rx-.5)*.014)*asp,uv.y);
  vec3 navy=vec3(.024,.165,.24),sky=vec3(.02,.576,.776),pink=vec3(.847,.224,.584),coral=vec3(1.,.43,.47),deep=vec3(.04,.16,.47);
  vec3 dark=mix(vec3(.008,.028,.045),vec3(.016,.085,.125),uv.y);
  vec3 blue=mix(vec3(.043,.5,.70),sky,smoothstep(0.,.6,uv.y));
  vec3 col=mix(dark,blue,uMix);
  /* site world: the tall pink figure with a white-hot core, a coral foot and a deep-blue shoulder */
  vec2 c1=vec2(asp*(.60+.05*sin(t*.23)),.50+.06*cos(t*.19));
  col=mix(col,deep,uMix*.7*blob(p,vec2(asp*(.80+.05*sin(t*.17+2.)),.80+.05*cos(t*.21)),vec2(.34,.5)));
  col=mix(col,pink,uMix*.95*blob(p,c1,vec2(.40,.46)));
  col=mix(col,coral,uMix*.75*blob(p,vec2(asp*(.50+.07*cos(t*.27)),.20+.05*sin(t*.31)),vec2(.32,.2)));
  col=mix(col,vec3(1.,.9,.96),uMix*.8*blob(p,c1+vec2(.05*sin(t*.4),.07),vec2(.16,.2)));
  /* dark world: the same colours pushed out to the corners so centred white text stays readable */
  float dk=1.-uMix;
  col=mix(col,pink,dk*.80*blob(p,vec2(asp*(.84+.07*sin(t*.31)),.20+.10*cos(t*.27)),vec2(.50,.42)));
  col=mix(col,sky,dk*.75*blob(p,vec2(asp*(.13+.07*cos(t*.25)),.80+.09*sin(t*.33)),vec2(.50,.44)));
  col=mix(col,coral,dk*.50*blob(p,vec2(asp*(.62+.10*sin(t*.21+1.)),-.04),vec2(.36,.2)));
  col=mix(col,deep,dk*.55*blob(p,vec2(asp*(.34+.10*cos(t*.19)),1.04),vec2(.4,.24)));
  /* logo reveal: a pink ring pulses out from the centre */
  float d=length(p-vec2(asp*.5,.5)),ring=exp(-pow((d-uSweep*1.5)/.13,2.))*step(.001,uSweep)*(1.-uSweep);
  col+=pink*ring*1.1+ring*.3;
  /* fluted glass ribs: lit on the left edge, shaded on the right */
  col+=(.10*(1.-smoothstep(0.,.45,rx))-.07*smoothstep(.6,1.,rx))*mix(.45,1.,uMix);
  col=mix(col,navy,uMix*(.16+.34*smoothstep(.55,1.,uv.y)));
  col+=(hash(f+fract(t)*91.7)-.5)*.028;
  gl_FragColor=vec4(col,1.);
}`;
if(gl){ const mk=(ty,src)=>{const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;};
  const pr=gl.createProgram(); gl.attachShader(pr,mk(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}')); gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FRAG)); gl.linkProgram(pr);
  if(gl.getProgramParameter(pr,gl.LINK_STATUS)){ gl.useProgram(pr); gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const a=gl.getAttribLocation(pr,'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
    U={res:gl.getUniformLocation(pr,'uRes'),t:gl.getUniformLocation(pr,'uT'),sw:gl.getUniformLocation(pr,'uSweep'),mix:gl.getUniformLocation(pr,'uMix')}; gl.uniform2f(U.res,glc.width,glc.height); } }
const blurCtx=$('#blur').getContext('2d');
function drawWorld(t,mix){ if(!U) return; const lg=S.logo.cfg; gl.uniform1f(U.t,t+40); gl.uniform1f(U.mix,mix); gl.uniform1f(U.sw,prog(t,lg.start+.25,lg.start+2.2)); gl.drawArrays(gl.TRIANGLES,0,3); }

/* ---------- master render: everything is a pure function of t ---------- */
const sceneAt=t=>TL.scenes.find(s=>t>=s.start&&t<s.end)||TL.scenes[TL.scenes.length-1];
function render(t){
  const X=TL.crossfade/2; let dream=0; for(let k=-4;k<=4;k++) dream+=sceneAt(clamp(t+k*.07,0,TL.duration-.001)).world==='dream'?1/9:0;
  drawWorld(t,1-Ez.io(dream));
  for(const id in S){ const s=S[id],c=s.cfg; const i=Ez.out(prog(t,c.start-X,c.start+X)), o=Ez.in(prog(t,c.end-X,c.end+X)), op=i*(1-o), bl=(1-i)*18+o*18;
    if(op<=.003){ if(s.on!==0){s.el.style.display='none';s.on=0;} continue; }
    if(s.on!==1){s.el.style.display='block';s.on=1;}
    s.el.style.opacity=op; s.el.style.transform=`scale(${lerp(.955,1,i)*lerp(1,1.07,o)})`; s.el.style.filter=bl>.3?`blur(${bl.toFixed(1)}px)`:'';
    s.render(t-c.start,t); }
  drawCursor(t);
  $('#flash').style.opacity=Math.max(1-prog(t,0,.4),prog(t,TL.duration-.3,TL.duration));
}

/* ---------- transport: play / scrub / record ---------- */
let t=0, playing=true, last=performance.now(), rec=false, prevT=0, audio=null;
if(MUSIC.src){ audio=new Audio(MUSIC.src); audio.preload='auto'; }
const syncAudio=()=>{ if(!audio) return; audio.currentTime=t+MUSIC.offset; playing?audio.play().catch(()=>{}):audio.pause(); };
const seek=$('#seek'), read=$('#read'); seek.max=TL.duration;
function fit(){ const bar=rec?0:64, s=Math.min(innerWidth/1920,(innerHeight-bar)/1080);
  $('#stage').style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-bar-1080*s)/2}px) scale(${s})`; }
function setPlaying(p){ playing=p; $('#bPlay').textContent=p?'Pause':'Play'; last=performance.now(); syncAudio(); }
function setRecord(on){ rec=on; document.body.classList.toggle('rec',on); fit(); if(on){ t=0; prevT=0; setPlaying(true); } }
function frame(now){
  if(playing){ t+=Math.min(.1,(now-last)/1000); if(t>=TL.duration){ t-=TL.duration; prevT=-1; syncAudio(); } }
  last=now; const tt=rec?Math.floor(t*TL.fps)/TL.fps:t;
  BEATS.forEach((b,i)=>{ if(prevT<b&&tt>=b) onBeat(i,b); }); prevT=tt;
  render(tt);
  if(!rec){ if(document.activeElement!==seek||playing) seek.value=tt;
    read.textContent=`${tt.toFixed(2)}s  f${String(Math.floor(tt*TL.fps)).padStart(4,'0')}  ${sceneAt(tt).id}`; }
  requestAnimationFrame(frame);
}
seek.addEventListener('input',()=>{ t=+seek.value; prevT=t; setPlaying(false); });
$('#bPlay').onclick=()=>setPlaying(!playing); $('#bRec').onclick=()=>setRecord(true);
addEventListener('keydown',e=>{ if(e.key===' '){e.preventDefault();setPlaying(!playing);} else if(e.key==='r'||e.key==='R')setRecord(!rec); else if(e.key==='Escape')setRecord(false);
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ setPlaying(false); t=clamp(t+(e.key==='ArrowRight'?1:-1)*(e.shiftKey?1:1/TL.fps),0,TL.duration-.001); prevT=t; } });
addEventListener('resize',fit);
TL.scenes.forEach(s=>{const m=document.createElement('i'); m.style.left=(s.start/TL.duration*100)+'%'; m.title=s.id; $('#marks').appendChild(m);});
BEATS.forEach(b=>{const m=document.createElement('i'); m.className='b'; m.style.left=(b/TL.duration*100)+'%'; m.style.top='30px'; $('#marks').appendChild(m);});
/* Frame-exact hooks for Remotion / Puppeteer capture: window.renderFrame(n) draws frame n and stops the clock. */
window.renderFrame=n=>{ playing=false; t=n/TL.fps; render(t); };
window.seekTo=s=>{ t=clamp(s,0,TL.duration-.001); prevT=t; render(t); };
window.TL=TL;
if(new URLSearchParams(location.search).has('record')) setRecord(true);
fit(); requestAnimationFrame(frame);
</script>
</body>
