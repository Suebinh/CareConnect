<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareConnect | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    // Brand tokens: edit colors and fonts here (same block is in all four files)
    tailwind.config = {
      theme: { extend: {
        fontFamily: {
          display: ['"Josefin Sans"', 'system-ui', 'sans-serif'],
          body: ['"Source Sans 3"', 'system-ui', 'sans-serif']
        },
        colors: {
          ink: '#14212B',
          paper: '#F8FAFA',
          pulse: { DEFAULT: '#0B6E6E', dark: '#085555', soft: '#E7F2F1' }
        }
      } }
    }
  </script>
  <style>
    /* The heartbeat line from the logo draws itself once on page load */
    .pulse-draw { stroke-dasharray: 1; animation: draw 1.8s ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse-draw { animation: none; } }
  </style>
</head>
<body class="min-h-screen bg-paper font-body text-ink antialiased">

  <!-- Header: logo (links home) on the left, Log in on the right -->
  <header class="border-b border-ink/10 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <a href="index.html" class="rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-pulse">
        <img src="logo.svg" alt="CareConnect home" class="h-8 w-auto sm:h-10">
      </a>
      <a href="login.html" class="rounded-full bg-pulse px-5 py-2 text-sm font-semibold text-white transition hover:bg-pulse-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-pulse">Log in</a>
    </div>
  </header>

  <main id="main" class="pb-20">
    <!-- Hero -->
    <section class="mx-auto max-w-3xl px-6 pt-16 text-center sm:pt-24">
      <h1 class="font-display text-4xl font-medium leading-tight sm:text-5xl md:text-6xl">Every appointment, on the same page.</h1>
      <p class="mx-auto mt-6 max-w-xl text-lg leading-relaxed text-ink/75">CareConnect gives patients, physicians, and clinic staff one shared schedule to book from, manage, and trust.</p>
    </section>

    <!-- Heartbeat line, echoing the logo -->
    <svg class="mx-auto mt-12 w-full max-w-4xl px-6" viewBox="0 0 1200 80" fill="none" aria-hidden="true">
      <path class="pulse-draw" pathLength="1" d="M0 40 H520 L532 33 L546 40 H590 L616 4 L640 74 L654 36 H1200" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- CENTER SPACE: replace the placeholder block below with your image or site information -->
    <section class="mx-auto mt-10 max-w-4xl px-6" aria-label="About CareConnect">
      <!--
        To use an image, delete the div below and paste:
        <img src="your-image.jpg" alt="Describe the image" class="aspect-video w-full rounded-2xl object-cover">
      -->
      <div class="flex aspect-video w-full items-center justify-center rounded-2xl border border-dashed border-pulse/50 bg-pulse-soft p-8 text-center">
        <div>
          <p class="font-display text-xl font-medium sm:text-2xl">Placeholder for website information</p>
          <p class="mx-auto mt-2 max-w-md text-sm text-ink/70"></p>
          <!-- Swap this block for a screenshot of the booking page, a photo of your team, or a short description of what CareConnect does. -->
        </div>
      </div>
    </section>
  </main>

</body>
</html>
