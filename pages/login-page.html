<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareConnect | Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    // Brand tokens: edit colors and fonts here (same block is in all four files)
    tailwind.config = {
      theme: { extend: {
        fontFamily: {
          display: ['"Josefin Sans"', 'system-ui', 'sans-serif'],
          body: ['"Source Sans 3"', 'system-ui', 'sans-serif']
        },
        colors: {
          ink: '#14212B',
          paper: '#F8FAFA',
          pulse: { DEFAULT: '#0B6E6E', dark: '#085555', soft: '#E7F2F1' }
        }
      } }
    }
  </script>
  <style>
    .pulse-draw { stroke-dasharray: 1; animation: draw 1.4s ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse-draw { animation: none; } }
  </style>
</head>
<body class="min-h-screen bg-paper font-body text-ink antialiased">

  <header class="border-b border-ink/10 bg-white">
    <div class="mx-auto flex max-w-6xl items-center px-6 py-4">
      <a href="index.html" class="rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-pulse">
        <img src="logo.svg" alt="CareConnect home" class="h-8 w-auto sm:h-10">
      </a>
    </div>
  </header>

  <main id="main" class="mx-auto max-w-3xl px-6 py-16 text-center sm:py-24">
    <svg class="mx-auto h-8 w-32" viewBox="0 0 160 40" fill="none" aria-hidden="true">
      <path class="pulse-draw" pathLength="1" d="M0 20 H58 L64 16 L70 20 H84 L96 3 L108 36 L114 18 H160" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 class="mt-6 font-display text-4xl font-medium sm:text-5xl">Log in to CareConnect</h1>
    <p class="mt-4 text-lg text-ink/75">Choose the option that matches how you use CareConnect.</p>

    <div class="mt-12 grid gap-5 text-left sm:grid-cols-2">
      <!-- Patient button: edit the href if you rename the file -->
      <a href="patient-login.html" class="group flex flex-col rounded-2xl border border-ink/15 bg-white p-8 transition hover:border-pulse hover:shadow-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-pulse">
        <span class="flex h-12 w-12 items-center justify-center rounded-full bg-pulse-soft text-pulse transition group-hover:bg-pulse group-hover:text-white">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
        </span>
        <span class="mt-6 font-display text-2xl font-medium">Patient login</span>
        <span class="mt-2 text-ink/70">View open times and manage your appointments.</span>
      </a>

      <!-- Staff button: edit the href if you rename the file -->
      <a href="staff-login.html" class="group flex flex-col rounded-2xl border border-ink/15 bg-white p-8 transition hover:border-pulse hover:shadow-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-pulse">
        <span class="flex h-12 w-12 items-center justify-center rounded-full bg-pulse-soft text-pulse transition group-hover:bg-pulse group-hover:text-white">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
        </span>
        <span class="mt-6 font-display text-2xl font-medium">Staff login</span>
        <span class="mt-2 text-ink/70">For physicians, PAs, nurses, and clinic administrators.</span>
      </a>
    </div>
  </main>

</body>
</html>
