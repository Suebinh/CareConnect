<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareConnect | Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body class="cc-page">
  <header class="mx-auto flex max-w-5xl items-center justify-between px-5 pt-6 sm:px-8 sm:pt-8">
    <a href="../index.html" class="cc-logo"><svg class="h-7 w-9" viewBox="0 0 48 40" fill="none" aria-hidden="true"><path d="M2 20 H12 L16 14 L20 20 H24 L30 6 L36 34 L40 20 H46" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>CareConnect</a>
    <a href="../index.html" class="cc-btn-ghost">Home</a>
  </header>

  <main id="main" class="mx-auto max-w-3xl px-5 py-16 sm:px-8 sm:py-24">
    <h1 class="text-[clamp(2.5rem,6vw,4rem)] font-light leading-[1.02] tracking-[-0.02em]">Log in to CareConnect</h1>
    <p class="mt-4 max-w-md text-snow/80">Choose the option that matches how you use CareConnect.</p>

    <div class="mt-12 grid gap-5 sm:grid-cols-2">
      <a href="patient-login.html" class="glass group flex flex-col rounded-[28px] p-7 transition hover:-translate-y-1 hover:shadow-[0_24px_50px_-18px_rgba(216,57,149,.7)]">
        <span class="glass-pill flex h-12 w-12 items-center justify-center rounded-full">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        </span>
        <span class="mt-8 flex items-center justify-between text-2xl font-light tracking-tight">Patient login <span aria-hidden="true" class="text-lg transition group-hover:translate-x-0.5 group-hover:-translate-y-0.5">↗</span></span>
        <span class="mt-2 text-sm text-snow/75">See your next appointment and keep your contact details up to date.</span>
      </a>
      <a href="staff-login.html" class="glass group flex flex-col rounded-[28px] p-7 transition hover:-translate-y-1 hover:shadow-[0_24px_50px_-18px_rgba(216,57,149,.7)]">
        <span class="glass-pill flex h-12 w-12 items-center justify-center rounded-full">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        </span>
        <span class="mt-8 flex items-center justify-between text-2xl font-light tracking-tight">Staff login <span aria-hidden="true" class="text-lg transition group-hover:translate-x-0.5 group-hover:-translate-y-0.5">↗</span></span>
        <span class="mt-2 text-sm text-snow/75">For physicians, PAs, nurses, receptionists, and analysts.</span>
      </a>
    </div>
  </main>
</body>
</html>
