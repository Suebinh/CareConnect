  <main id="main" class="mx-auto max-w-md px-6 py-16 sm:py-24">
    <svg class="h-8 w-32" viewBox="0 0 160 40" fill="none" aria-hidden="true">
      <path class="pulse-draw" pathLength="1" d="M0 20 H58 L64 16 L70 20 H84 L96 3 L108 36 L114 18 H160" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 class="mt-6 font-display text-4xl font-medium">Create your account</h1>
    <p class="mt-3 text-ink/75">Sign up and choose the role that fits how you use CareConnect.</p>

    <!-- BACKEND: change action to your registration route and method as needed.
         The "role" field values below are what the server receives. -->
    <form id="register-form" action="#" method="post" class="mt-8 space-y-5 rounded-2xl border border-ink/10 bg-white p-6 shadow-sm sm:p-8">
      <div class="grid gap-5 sm:grid-cols-2">
        <div>
          <label for="first-name" class="block text-sm font-semibold">First name</label>
          <input id="first-name" name="first_name" type="text" autocomplete="given-name" required class="mt-2 block w-full rounded-lg border border-ink/20 bg-white px-4 py-3 text-base focus:border-pulse focus:outline-none focus:ring-2 focus:ring-pulse/30">
        </div>
        <div>
          <label for="last-name" class="block text-sm font-semibold">Last name</label>
          <input id="last-name" name="last_name" type="text" autocomplete="family-name" required class="mt-2 block w-full rounded-lg border border-ink/20 bg-white px-4 py-3 text-base focus:border-pulse focus:outline-none focus:ring-2 focus:ring-pulse/30">
        </div>
      </div>
      <div>
        <label for="role" class="block text-sm font-semibold">Your role</label>
        <!-- Add, remove, or rename roles here. Keep each value in sync with your backend. -->
        <select id="role" name="role" required class="mt-2 block w-full rounded-lg border border-ink/20 bg-white px-4 py-3 text-base focus:border-pulse focus:outline-none focus:ring-2 focus:ring-pulse/30">
          <option value="" disabled selected>Select your role</option>
          <option value="patient">Patient</option>
          <option value="physician">Physician</option>
          <option value="pa">Physician Assistant (PA)</option>
          <option value="nurse">Nurse</option>
          <option value="receptionist">Receptionist</option>
          <option value="data_analyst">Data Analyst</option>
          <option value="process_manager">Process Manager</option>
        </select>
      </div>
      <div>
        <label for="email" class="block text-sm font-semibold">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required class="mt-2 block w-full rounded-lg border border-ink/20 bg-white px-4 py-3 text-base focus:border-pulse focus:outline-none focus:ring-2 focus:ring-pulse/30">
      </div>
      <div>
        <label for="username" class="block text-sm font-semibold">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required class="mt-2 block w-full rounded-lg border border-ink/20 bg-white px-4 py-3 text-base focus:border-pulse focus:outline-none focus:ring-2 focus:ring-pulse/30">
      </div>
      <div>
        <label for="password" class="block text-sm font-semibold">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="pw-hint" class="mt-2 block w-full rounded-lg border border-ink/20 bg-white px-4 py-3 text-base focus:border-pulse focus:outline-none focus:ring-2 focus:ring-pulse/30">
        <p id="pw-hint" class="mt-2 text-sm text-ink/60">Use at least 8 characters.</p>
      </div>
      <div>
        <label for="confirm" class="block text-sm font-semibold">Confirm password</label>
        <input id="confirm" name="confirm_password" type="password" autocomplete="new-password" required class="mt-2 block w-full rounded-lg border border-ink/20 bg-white px-4 py-3 text-base focus:border-pulse focus:outline-none focus:ring-2 focus:ring-pulse/30">
      </div>
      <button type="submit" class="w-full rounded-full bg-pulse px-6 py-3 font-semibold text-white transition hover:bg-pulse-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-pulse">Create account</button>
    </form>

    <p class="mt-6 text-sm text-ink/70">Already have an account? <a href="login.html" class="font-semibold text-pulse underline underline-offset-4 hover:text-pulse-dark">Log in</a></p>
  </main>

  <script>
    // Preselects the role when a page links here with ?role=patient (etc.)
    const roleSelect = document.getElementById('role');
    const wanted = new URLSearchParams(location.search).get('role');
    if (wanted && [...roleSelect.options].some(o => o.value === wanted)) roleSelect.value = wanted;

    // Blocks submit if the two passwords differ
    const pw = document.getElementById('password');
    const confirmPw = document.getElementById('confirm');
    function checkMatch() {
      confirmPw.setCustomValidity(pw.value === confirmPw.value ? '' : 'Passwords do not match.');
    }
    pw.addEventListener('input', checkMatch);
    confirmPw.addEventListener('input', checkMatch);
  </script>
</body>
