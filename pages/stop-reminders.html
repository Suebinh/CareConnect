<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>CareConnect | Reminder emails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/api.js"></script>
</head>
<body class="cc-page">
  <header class="mx-auto flex max-w-5xl items-center justify-between px-5 pt-6 sm:px-8 sm:pt-8">
    <a href="../index.html" class="cc-logo"><svg class="h-7 w-9" viewBox="0 0 48 40" fill="none" aria-hidden="true"><path d="M2 20 H12 L16 14 L20 20 H24 L30 6 L36 34 L40 20 H46" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>CareConnect</a>
    <a href="patient-login.html" class="cc-btn-ghost">Log in</a>
  </header>

  <main id="main" class="mx-auto max-w-md px-5 py-14 sm:px-8 sm:py-20">
    <h1 id="title" class="text-4xl font-light tracking-[-0.02em]">Stop reminder emails?</h1>
    <p id="text" class="mt-3 text-snow/85">You won’t get an email before your visits anymore. Your appointments stay booked.</p>
    <p id="error" role="alert" hidden class="cc-alert cc-alert-error mt-6"></p>
    <div class="mt-8 flex flex-wrap gap-3">
      <button id="go" type="button" class="cc-btn">Stop reminder emails</button>
      <a id="keep" href="../index.html" class="cc-btn-ghost">Keep them</a>
    </div>
    <p class="mt-8 text-sm text-snow/80">You can change this any time from your profile after logging in.</p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const q = new URLSearchParams(location.search);
    const u = q.get('u'), s = q.get('s');
    let enabled = true; // what the setting is before this page acts

    async function set(nextEnabled) {
      $('go').disabled = true;
      $('error').hidden = true;
      try {
        await apiFetch('/links/stop-reminders', { method: 'POST', body: JSON.stringify({ u, s, enabled: nextEnabled }) });
        enabled = nextEnabled;
        $('title').textContent = enabled ? 'Reminder emails are back on' : 'Reminder emails are off';
        $('text').textContent = enabled
          ? 'We’ll email you before each visit again.'
          : 'You won’t get reminder emails anymore. Your appointments stay booked.';
        $('go').textContent = enabled ? 'Stop reminder emails' : 'Turn them back on';
        $('keep').hidden = true;
      } catch (err) {
        $('error').textContent = err.message;
        $('error').hidden = false;
      }
      $('go').disabled = false;
    }
    // A tap is required (no auto-unsubscribe on open), so email link-scanners can't flip it.
    $('go').addEventListener('click', () => set(!enabled));
    if (!u || !s) {
      $('title').textContent = 'This link isn’t valid';
      $('text').textContent = 'Log in and use the Email reminders switch on your profile instead.';
      $('go').hidden = true;
    }
  </script>
</body>
</html>
