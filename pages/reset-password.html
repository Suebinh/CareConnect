<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    // Brand tokens: same block as the other pages
    tailwind.config = {
      theme: { extend: {
        fontFamily: { display: ["Josefin Sans", "system-ui", "sans-serif"], body: ["Source Sans 3", "system-ui", "sans-serif"] },
        colors: { ink: "#14212B", paper: "#F8FAFA", pulse: { DEFAULT: "#0B6E6E", dark: "#085555", soft: "#E7F2F1" } }
      } }
    }
  </script>
  <title>CareConnect | Reset password</title>
  <script src="../js/api.js"></script>
</head>
<body class="min-h-screen bg-paper font-body text-ink antialiased">
  <header class="border-b border-ink/10 bg-white">
    <div class="mx-auto flex max-w-6xl items-center px-6 py-4">
      <a href="../index.html"><img src="../logo.svg" alt="CareConnect home" class="h-8 w-auto sm:h-10"></a>
    </div>
  </header>

  <main class="mx-auto max-w-md px-6 py-16 sm:py-24">
    <!-- Step 1: ask for a link (shown when the page is opened without a token) -->
    <section id="request-panel" hidden>
      <h1 class="font-display text-4xl font-medium">Reset your password</h1>
      <p class="mt-3 text-ink/75">Enter your account email and we'll send a reset link.</p>
      <form id="request-form" novalidate class="mt-8 space-y-5 rounded-2xl border border-ink/10 bg-white p-6 shadow-sm sm:p-8">
        <p id="request-msg" role="status" hidden class="rounded-lg border border-pulse/30 bg-pulse-soft px-4 py-3 text-sm"></p>
        <div>
          <label for="email" class="block text-sm font-semibold">Email</label>
          <input id="email" type="email" autocomplete="username" required class="mt-2 block w-full rounded-lg border border-ink/20 px-4 py-3 focus:border-pulse focus:outline-none focus:ring-2 focus:ring-pulse/30">
        </div>
        <button type="submit" class="w-full rounded-full bg-pulse px-6 py-3 font-semibold text-white hover:bg-pulse-dark">Send reset link</button>
      </form>
    </section>

    <!-- Step 2: choose a new password (page opened from the email link) -->
    <section id="reset-panel" hidden>
      <h1 class="font-display text-4xl font-medium">Choose a new password</h1>
      <p class="mt-3 text-ink/75">Use at least 8 characters.</p>
      <form id="reset-form" novalidate class="mt-8 space-y-5 rounded-2xl border border-ink/10 bg-white p-6 shadow-sm sm:p-8">
        <p id="reset-error" role="alert" hidden class="rounded-lg border border-[#F4B6B0] bg-[#FEF3F2] px-4 py-3 text-sm text-[#B42318]"></p>
        <div>
          <label for="pw" class="block text-sm font-semibold">New password</label>
          <input id="pw" type="password" autocomplete="new-password" required class="mt-2 block w-full rounded-lg border border-ink/20 px-4 py-3 focus:border-pulse focus:outline-none focus:ring-2 focus:ring-pulse/30">
        </div>
        <div>
          <label for="pw2" class="block text-sm font-semibold">Confirm new password</label>
          <input id="pw2" type="password" autocomplete="new-password" required class="mt-2 block w-full rounded-lg border border-ink/20 px-4 py-3 focus:border-pulse focus:outline-none focus:ring-2 focus:ring-pulse/30">
        </div>
        <button type="submit" class="w-full rounded-full bg-pulse px-6 py-3 font-semibold text-white hover:bg-pulse-dark">Save new password</button>
      </form>
    </section>

    <!-- Done -->
    <section id="done-panel" hidden>
      <h1 class="font-display text-4xl font-medium">Password updated</h1>
      <p class="mt-3 text-ink/75">You can now log in with your new password. Any old sessions were signed out.</p>
      <a href="staff-login.html" class="mt-8 block rounded-full bg-pulse px-6 py-3 text-center font-semibold text-white hover:bg-pulse-dark">Go to staff login</a>
    </section>

    <p class="mt-6 text-sm"><a href="staff-login.html" class="font-semibold text-pulse underline underline-offset-4">Back to staff login</a></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(location.search).get('token');
    $(token ? 'reset-panel' : 'request-panel').hidden = false;

    $('request-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = $('request-msg');
      const email = $('email').value.trim();
      if (!email) { msg.textContent = 'Enter your email.'; msg.hidden = false; return; }
      try {
        const data = await apiFetch('/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
        msg.textContent = data.message;
      } catch (err) { msg.textContent = err.message; }
      msg.hidden = false;
    });

    $('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = $('reset-error');
      err.hidden = true;
      const pw = $('pw').value;
      if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.hidden = false; return; }
      if (pw !== $('pw2').value) { err.textContent = 'The two passwords do not match.'; err.hidden = false; return; }
      try {
        await apiFetch('/auth/reset-password', { method: 'POST', body: JSON.stringify({ token, password: pw }) });
        $('reset-panel').hidden = true;
        $('done-panel').hidden = false;
      } catch (e2) { err.textContent = e2.message; err.hidden = false; }
    });
  </script>
</body>
</html>
