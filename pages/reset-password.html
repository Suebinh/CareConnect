<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareConnect | Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/api.js"></script>
</head>
<body class="cc-page">
  <header class="mx-auto flex max-w-5xl items-center justify-between px-5 pt-6 sm:px-8 sm:pt-8">
    <a href="../index.html" class="cc-logo"><svg class="h-7 w-9" viewBox="0 0 48 40" fill="none" aria-hidden="true"><path d="M2 20 H12 L16 14 L20 20 H24 L30 6 L36 34 L40 20 H46" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>CareConnect</a>
    <a href="login-page.html" class="cc-btn-ghost">All login options</a>
  </header>

  <main id="main" class="mx-auto max-w-md px-5 py-14 sm:px-8 sm:py-20">
    <!-- Step 1: ask for a link (shown when the page is opened without a token) -->
    <section id="request-panel" hidden>
      <h1 class="text-5xl font-light tracking-[-0.02em]">Reset your password</h1>
      <p class="mt-3 text-snow/80">Enter your account email and we’ll send a reset link.</p>
      <form id="request-form" novalidate class="glass mt-8 space-y-5 rounded-[28px] p-6 sm:p-8">
        <p id="request-msg" role="status" hidden class="cc-alert"></p>
        <div>
          <label for="email" class="cc-label">Email</label>
          <input id="email" type="email" autocomplete="username" required class="cc-field">
        </div>
        <button type="submit" class="cc-btn w-full">Send reset link</button>
      </form>
    </section>

    <!-- Step 2: choose a new password (page opened from the email link) -->
    <section id="reset-panel" hidden>
      <h1 class="text-5xl font-light tracking-[-0.02em]">Choose a new password</h1>
      <p class="mt-3 text-snow/80">Use at least 8 characters.</p>
      <form id="reset-form" novalidate class="glass mt-8 space-y-5 rounded-[28px] p-6 sm:p-8">
        <p id="reset-error" role="alert" hidden class="cc-alert cc-alert-error"></p>
        <div>
          <label for="pw" class="cc-label">New password</label>
          <input id="pw" type="password" autocomplete="new-password" required class="cc-field">
        </div>
        <div>
          <label for="pw2" class="cc-label">Confirm new password</label>
          <input id="pw2" type="password" autocomplete="new-password" required class="cc-field">
        </div>
        <button type="submit" class="cc-btn w-full">Save new password</button>
      </form>
    </section>

    <!-- Done -->
    <section id="done-panel" hidden>
      <h1 class="text-5xl font-light tracking-[-0.02em]">Password updated</h1>
      <p class="mt-3 text-snow/80">You can now log in with your new password. Any old sessions were signed out.</p>
      <a href="login-page.html" class="cc-btn mt-8 w-full">Go to login</a>
    </section>

    <p class="mt-6 text-sm"><a href="login-page.html" class="cc-link">Back to login</a></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(location.search).get('token');
    $(token ? 'reset-panel' : 'request-panel').hidden = false;

    $('request-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = $('request-msg');
      const email = $('email').value.trim();
      if (!email) { msg.textContent = 'Enter your email.'; msg.hidden = false; return; }
      try {
        const data = await apiFetch('/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
        msg.textContent = data.message;
      } catch (err) { msg.textContent = err.message; }
      msg.hidden = false;
    });

    $('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = $('reset-error');
      err.hidden = true;
      const pw = $('pw').value;
      if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.hidden = false; return; }
      if (pw !== $('pw2').value) { err.textContent = 'The two passwords do not match.'; err.hidden = false; return; }
      try {
        await apiFetch('/auth/reset-password', { method: 'POST', body: JSON.stringify({ token, password: pw }) });
        $('reset-panel').hidden = true;
        $('done-panel').hidden = false;
      } catch (e2) { err.textContent = e2.message; err.hidden = false; }
    });
  </script>
</body>
</html>
