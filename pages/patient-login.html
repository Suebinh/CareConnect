<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareConnect | Patient login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body class="cc-page">
  <header class="mx-auto flex max-w-5xl items-center justify-between px-5 pt-6 sm:px-8 sm:pt-8">
    <a href="../index.html" class="cc-logo"><svg class="h-7 w-9" viewBox="0 0 48 40" fill="none" aria-hidden="true"><path d="M2 20 H12 L16 14 L20 20 H24 L30 6 L36 34 L40 20 H46" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>CareConnect</a>
    <a href="login-page.html" class="cc-btn-ghost">All login options</a>
  </header>

  <main id="main" class="mx-auto max-w-md px-5 py-14 sm:px-8 sm:py-20">
    <h1 class="text-5xl font-light tracking-[-0.02em]">Patient login</h1>
    <p class="mt-3 text-snow/80">Enter your email and password to see your appointments.</p>

    <form id="login-form" class="glass mt-8 space-y-5 rounded-[28px] p-6 sm:p-8">
      <p id="login-error" role="alert" hidden class="cc-alert cc-alert-error"></p>
      <div>
        <label for="email" class="cc-label">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required class="cc-field">
      </div>
      <div>
        <div class="flex items-baseline justify-between">
          <label for="password" class="cc-label">Password</label>
          <a href="reset-password.html" class="cc-link text-sm">Forgot password?</a>
        </div>
        <input id="password" name="password" type="password" autocomplete="current-password" required class="cc-field">
      </div>
      <button type="submit" class="cc-btn w-full">Log in</button>
    </form>

    <p class="mt-6 text-sm text-snow/80">New patient? <a href="patient-signup.html" class="cc-link">Create an account</a></p>
    <p class="mt-2 text-sm text-snow/80">Trouble logging in? Contact your clinic’s front desk.</p>
    <p class="mt-2 text-sm text-snow/80">Clinic staff? <a href="staff-login.html" class="cc-link">Go to staff login</a></p>
  </main>

  <script src="../js/api.js"></script>
  <script>
    setupLoginForm(document.getElementById('login-form'), document.getElementById('login-error'));
  </script>
</body>
</html>
