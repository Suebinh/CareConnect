<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareConnect | Nurse schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/api.js"></script>
</head>
<body class="cc-page">
  <header class="mx-auto flex max-w-5xl items-center justify-between gap-3 px-5 pt-6 sm:px-8 sm:pt-8">
    <a href="../index.html" class="cc-logo"><svg class="h-7 w-9" viewBox="0 0 48 40" fill="none" aria-hidden="true"><path d="M2 20 H12 L16 14 L20 20 H24 L30 6 L36 34 L40 20 H46" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>CareConnect</a>
    <div class="flex items-center gap-2">
      <a href="profile.html" class="cc-btn-ghost">My profile</a>
      <button id="logout" class="cc-btn-ghost">Log out</button>
    </div>
  </header>

  <main id="main" class="mx-auto max-w-5xl px-5 py-12 sm:px-8 sm:py-16">
    <div class="flex flex-wrap items-end justify-between gap-6">
      <div>
        <h1 class="text-5xl font-light tracking-[-0.02em]">Daily schedule</h1>
        <p id="subtitle" class="mt-3 text-snow/80">Appointments for the providers you support.</p>
      </div>
      <div class="flex items-end gap-2">
        <div>
          <label for="date" class="cc-label">Date</label>
          <input id="date" type="date" class="cc-field cc-field-inline">
        </div>
        <button id="today" class="cc-btn-ghost py-2.5">Today</button>
      </div>
    </div>

    <p id="providers" class="mt-8 text-sm text-snow/80"></p>
    <p id="message" role="status" class="mt-4 text-snow/85"></p>

    <div class="glass mt-4 overflow-x-auto rounded-[24px] px-2 py-1">
      <table id="schedule" class="cc-table" hidden>
        <thead>
          <tr><th>Time</th><th>Provider</th><th>Patient</th><th>Appointment type</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script>
    if (requireLogin(['nurse', 'physician'])) {
      const $ = (id) => document.getElementById(id);
      const STATUS = { booked: 'Booked', completed: 'Completed', no_show: 'No-show', cancelled: 'Cancelled' };
      const today = () => new Date().toLocaleDateString('en-CA');

      $('date').value = today();
      $('logout').addEventListener('click', logout);
      $('today').addEventListener('click', () => { $('date').value = today(); load(); });
      $('date').addEventListener('change', load);

      async function load() {
        const body = document.querySelector('#schedule tbody');
        body.innerHTML = '';
        $('schedule').hidden = true;
        $('schedule').parentElement.hidden = true;
        $('message').textContent = 'Loading…';
        try {
          const data = await apiFetch('/schedules/supervised?date=' + $('date').value);
          $('providers').textContent = data.providers.length
            ? 'Providers you support: ' + data.providers.map(p => p.name).join(', ')
            : '';
          if (!data.providers.length) { $('message').textContent = 'You are not linked to any providers yet. Ask a Process Manager to assign them.'; return; }
          if (!data.appointments.length) { $('message').textContent = 'No appointments on this day.'; return; }
          $('message').textContent = '';
          data.appointments.forEach(a => {
            const row = body.insertRow();
            [a.start_time + '–' + a.end_time, a.provider_name, a.patient_name, a.appointment_type]
              .forEach(v => { row.insertCell().textContent = v; });
            const chip = document.createElement('span');
            chip.className = 'cc-chip cc-chip-' + a.status;
            chip.textContent = STATUS[a.status] || a.status;
            row.insertCell().appendChild(chip);
          });
          $('schedule').hidden = false;
          $('schedule').parentElement.hidden = false;
        } catch (err) { $('message').textContent = err.message; }
      }
      load();
    }
  </script>
</body>
</html>
